name: Build Kazuizhi AI V1.9.5 Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check environment
        run: |
          python --version
          pip --version
          cd
          dir

      - name: Verify source tree
        run: |
          echo "Workspace"
          echo $env:GITHUB_WORKSPACE
          dir
          dir 03_V1.9.5_Source
          dir 04_Build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_V1.9.5_Source/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller 04_Build/kazuizhi_v1.9.5.spec

      - name: Prepare Installer Package
        shell: powershell
        run: |
          if (Test-Path "04_Build/installer/build_installer.ps1") {
            powershell -ExecutionPolicy Bypass -File "04_Build/installer/build_installer.ps1"
          } else {
            echo "Installer script not found, skip installer stage"
          }

      - name: Upload Alpha EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Alpha
          path: dist/

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Setup
          path: installer_output/
          if-no-files-found: warn
