name: Build Kazuizhi AI V1.9.5 Enterprise

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_V1.9.5_Source/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller 04_Build/kazuizhi_v1.9.5.spec

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Prepare Installer Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "04_Build/installer/build_installer.ps1"

      - name: Upload Enterprise EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Enterprise
          path: dist/

      - name: Upload Enterprise Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Enterprise_Setup
          path: installer_output/
          if-no-files-found: error
