name: Build Kazuizhi AI V1.9.5 Enterprise R2

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Enterprise R2 dashboard source
        shell: powershell
        run: |
          $index = "03_V1.9.5_Source/web_release_v2/index.html"
          $version = "03_V1.9.5_Source/web_release_v2/WEB_VERSION.txt"
          if (!(Test-Path $index)) { throw "Missing R2 dashboard index: $index" }
          if (!(Test-Path $version)) { throw "Missing R2 dashboard version file: $version" }
          $indexContent = Get-Content $index -Raw
          $versionContent = Get-Content $version -Raw
          if ($indexContent -notmatch "KZ-ENTERPRISE-R2-20260915") { throw "R2 index marker mismatch" }
          if ($versionContent -notmatch "KZ-ENTERPRISE-R2-20260915") { throw "R2 version marker mismatch" }
          Write-Host "R2 source validation passed: KZ-ENTERPRISE-R2-20260915"

      - name: Clean previous build files
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path installer_output) { Remove-Item installer_output -Recurse -Force }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_V1.9.5_Source/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller 04_Build/kazuizhi_v1.9.5.spec

      - name: Validate packaged Enterprise R2 dashboard
        shell: powershell
        run: |
          $packedIndex = "dist/Kazuizhi_AI_V1.9.5_Enterprise/_internal/web/index.html"
          $packedVersion = "dist/Kazuizhi_AI_V1.9.5_Enterprise/_internal/web/WEB_VERSION.txt"
          if (!(Test-Path $packedIndex)) { throw "Packaged R2 index not found: $packedIndex" }
          if (!(Test-Path $packedVersion)) { throw "Packaged R2 version file not found: $packedVersion" }
          $packedIndexContent = Get-Content $packedIndex -Raw
          $packedVersionContent = Get-Content $packedVersion -Raw
          if ($packedIndexContent -notmatch "KZ-ENTERPRISE-R2-20260915") { throw "Packaged dashboard is not Enterprise R2" }
          if ($packedVersionContent -notmatch "KZ-ENTERPRISE-R2-20260915") { throw "Packaged version marker is not Enterprise R2" }
          Write-Host "Packaged dashboard validated: KZ-ENTERPRISE-R2-20260915"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Prepare Installer Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "04_Build/installer/build_installer.ps1"

      - name: Upload Enterprise EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Enterprise_R2
          path: dist/

      - name: Upload Enterprise Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Enterprise_R2_Setup
          path: installer_output/
          if-no-files-found: error
