name: Build Kazuizhi AI V1.9.5 Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check environment
        run: |
          python --version
          pip --version
          dir

      - name: Verify source tree
        run: |
          echo "Current directory"
          cd
          echo "Repository root"
          dir
          echo "V1.9.5 source tree"
          dir 03_V1.9.5_Source
          echo "Build tree"
          dir 04_Build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_V1.9.5_Source/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller 04_Build/kazuizhi_v1.9.5.spec

      - name: Upload Alpha Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_V1.9.5_Alpha
          path: dist/
