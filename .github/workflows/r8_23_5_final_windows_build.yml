name: R8-23.5 Final Windows Build

on:
  push:
    branches:
      - r8-23-5-full-regression-recovery-20261004
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repaired branch
        uses: actions/checkout@v4
        with:
          ref: r8-23-5-full-regression-recovery-20261004

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp visible build number and commit
        run: |
          $path = '05_V2.0.0_Source/web/build_info.js'
          $text = Get-Content -LiteralPath $path -Raw
          $shortSha = '${{ github.sha }}'.Substring(0, 8)
          $text = $text.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $text = $text.Replace('__GITHUB_SHA__', $shortSha)
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8

      - name: Install build and browser-test dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt pytest playwright
          python -m playwright install chromium

      - name: Verify R8-23.5 regression recovery
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m py_compile 05_V2.0.0_Source/promotion/chatgpt_mission_patch.py
          python -m py_compile 05_V2.0.0_Source/backend/r8_23_5_full_recovery_patch.py
          python -m pytest -q 04_Build/v2/test_r8_23_5_full_recovery.py
          python 04_Build/v2/test_r8_23_4_runtime_route_recovery.py
          python 04_Build/v2/test_r8_23_4_full_ui_simulation.py
          python 04_Build/v2/test_r8_23_3_candidate.py
          python 04_Build/v2/test_r8_23_2_runtime_truth.py
          python 04_Build/v2/test_r8_22_autonomous_convergence.py
          python 04_Build/v2/test_r8_20_seo_geo_growth.py
          python 04_Build/v2/test_r8_19_geo_phase3.py

      - name: Check every browser script
        run: |
          Get-ChildItem 05_V2.0.0_Source/web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" } }

      - name: Verify current source closed loop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/verify_v2_autonomous.py --source
          python 04_Build/v2/verify_r8_operational.py --source

      - name: Build packaged runtime and installer
        run: ./04_Build/build_v2_windows.ps1 -SkipSourceVerification

      - name: Test silent install launch overwrite and uninstall
        run: ./04_Build/v2/test_installer.ps1

      - name: Record final installer provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "Final installer missing: $setup" }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = 'R8-23.5 Full Regression Recovery'
            commit = '${{ github.sha }}'
            run_number = '${{ github.run_number }}'
            sha256 = $hash
            fixes = @('cumulative R8-22 through R8-23.5 runtime loading','SEO/GEO existing-route binding','full SEO/GEO browser bundle','owner cockpit recovery','legacy 20/20 shell regression guard')
          } | ConvertTo-Json -Depth 4 | Set-Content installer_output_v2/BUILD_RECORD_R8_23_5.json

      - name: Upload final Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_R8_23_5_Final_Windows_Installer
          path: installer_output_v2/
          if-no-files-found: error
          retention-days: 90
