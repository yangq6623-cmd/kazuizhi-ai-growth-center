name: Build Kazuizhi AI Enterprise V2.1.0 Beta R8 Preview
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/v2-*']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/v2/**'
      - '04_Build/kazuizhi_v2.0.0.spec'
      - '04_Build/build_v2_windows.ps1'
      - '04_Build/installer/*v2*'
      - '04_Build/installer/*V2*'
      - '.github/workflows/build_v2_enterprise_beta.yml'
  pull_request:
    branches: [main]
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - '.github/workflows/build_v2_enterprise_beta.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp R8 Preview build number and commit
        run: |
          $path = '05_V2.0.0_Source/web/build_info.js'
          $text = Get-Content -LiteralPath $path -Raw
          $text = $text.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $text = $text.Replace('__GITHUB_SHA__', '${{ github.sha }}')
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8
      - name: Install build dependencies
        run: |
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Verify R6 migration and audit corruption protection
        run: python 04_Build/v2/test_r7_engine.py
      - name: Verify R7 Block A stability and durable persistence
        run: python 04_Build/v2/test_r7_block_a.py
      - name: Verify R7 Block B command center and bidirectional bridge
        run: python 04_Build/v2/test_r7_block_b.py
      - name: Verify full daily AI workforce and manager dashboard UX
        run: python 04_Build/v2/test_daily_workforce.py
      - name: Verify autonomous decision center and employee manager reports
        run: python 04_Build/v2/test_decision_center.py
      - name: Verify regional operations strategy and expansion guardrails
        run: python 04_Build/v2/test_region_strategy.py
      - name: Verify R8-00 safety and single-real-device pilot control plane
        run: python 04_Build/v2/test_r8_block_00.py
      - name: Verify R8-01 Android ADB device center contract
        run: python 04_Build/v2/test_r8_device_center.py
      - name: Verify R8 Preview package and visible identity separation
        run: python 04_Build/v2/test_r8_identity.py
      - name: Verify production business source safety contract
        run: python 04_Build/v2/test_live_business_source.py
      - name: Verify every visible R7 control has an interaction path
        run: python 04_Build/v2/test_ui_interactions.py
      - name: Check frontend script syntax
        run: |
          Get-ChildItem 05_V2.0.0_Source/web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" } }
      - name: Build and verify V2 source and packaged runtime
        run: ./04_Build/build_v2_windows.ps1
      - name: Test silent install, launch, reinstall and uninstall
        run: ./04_Build/v2/test_installer.ps1
      - name: Record verified R8 Preview artifact provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.1.0_R8_Preview.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.1.0_R8_Preview.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = 'V2.1.0 Beta R8 Preview'
            phase = 'R8-00 + R8-01 device-center preview'
            runtime_build = 'KZ-ENTERPRISE-V2.1-BETA-20260918-R8-PREVIEW'
            r7_compatibility_build = 'KZ-ENTERPRISE-V2-BETA-20260917-R7-FINAL'
            github_run_number = '${{ github.run_number }}'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sha256 = $hash
            checks = @('R7 Final core compatibility preserved', 'R8 Preview package identity', 'R8 visible build number and commit', 'R8-00 one-real-device pilot limit', 'R8-00 owner focus', 'R8-00 owner-gated video publishing', 'R8-00 finance manual-only boundary', 'R8-00 anti-spoofing and no-risk-evasion guardrails', 'R8-00 verification human fail-safe', 'R8-01 truthful ADB device detection contract', 'R8-01 screenshot/action/takeover API wiring', 'R8-01 device operation audit', 'R8-01 lock-screen stop boundary', 'R6 migration', 'R7 persistent user data', 'R7 bidirectional bridge', 'eight-role AI workforce', 'autonomous decision center', 'regional operations strategy', 'verified production read-only business source', 'visible UI interaction binding', 'frontend JavaScript syntax', 'windowed runtime packaging', 'silent install', 'active-runtime reinstall', 'user data preservation', 'uninstall')
            acceptance = 'Automated checks passed; owner visual acceptance and first real Android device test pending'
          } | ConvertTo-Json -Depth 4 | Set-Content installer_output_v2/BUILD_RECORD.json
          Copy-Item docs/V2.0.0_BETA_R7_CORE_HANDOFF_20260916.md installer_output_v2/R7_CORE_HANDOFF.md
          Copy-Item docs/R7_FINAL_USER_GUIDE.md installer_output_v2/R7_FINAL_USER_GUIDE.md
          Copy-Item docs/R7_FINAL_TEST_REPORT.md installer_output_v2/R7_FINAL_TEST_REPORT.md
          Copy-Item docs/R8_PREVIEW_R8_00_HANDOFF_20260918.md installer_output_v2/R8_PREVIEW_HANDOFF.md
          Copy-Item docs/R8_R7_TO_R8_DECISION_LEDGER_AND_DEVICE_PLAN_20260918.md installer_output_v2/R8_DECISION_LEDGER_AND_DEVICE_PLAN.md
      - name: Upload V2.1.0 Beta R8 Preview installer
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_V2.1.0_R8_Preview
          path: installer_output_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Upload V2.1.0 Beta R8 Preview portable application
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_V2.1.0_R8_Preview_Portable
          path: dist_v2/
          if-no-files-found: error
          retention-days: 90
