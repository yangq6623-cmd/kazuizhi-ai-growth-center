name: Build Kazuizhi AI Enterprise V2.2 R8 Operational
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/v2-*']
    tags: ['v2.2.0-r8-operational*']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - 'docs/R8_OPERATIONAL_*'
      - '.github/workflows/build_v2_enterprise_beta.yml'
  pull_request:
    branches: [main]
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - '.github/workflows/build_v2_enterprise_beta.yml'
permissions:
  contents: write
  id-token: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp visible build number and commit
        run: |
          $path = '05_V2.0.0_Source/web/build_info.js'
          $text = Get-Content -LiteralPath $path -Raw
          $shortSha = '${{ github.sha }}'.Substring(0, 8)
          $text = $text.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $text = $text.Replace('__GITHUB_SHA__', $shortSha)
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8
      - name: Install pinned build and video dependencies
        run: |
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Verify inherited R7 data safety and command engine
        run: |
          python 04_Build/v2/test_r7_engine.py
          python 04_Build/v2/test_r7_block_a.py
          python 04_Build/v2/test_r7_block_b.py
      - name: Verify inherited R8 final control plane and growth loop
        run: |
          python 04_Build/v2/test_daily_workforce.py
          python 04_Build/v2/test_decision_center.py
          python 04_Build/v2/test_region_strategy.py
          python 04_Build/v2/test_r8_block_00.py
          python 04_Build/v2/test_r8_device_center.py
          python 04_Build/v2/test_r8_social_center.py
          python 04_Build/v2/test_r8_complete_growth_ops.py
          python 04_Build/v2/test_r8_identity.py
          python 04_Build/v2/test_r8_completion_upgrade.py
          python 04_Build/v2/test_live_business_source.py
          python 04_Build/v2/test_ui_interactions.py
          python 04_Build/v2/test_v221_productization.py
          python 04_Build/v2/test_r8_realtime_mirror.py
      - name: Check every browser script
        run: |
          Get-ChildItem 05_V2.0.0_Source/web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" } }
          node 04_Build/v2/test_operational_device_live.js
          if ($LASTEXITCODE -ne 0) { throw 'Operational realtime mirror browser regression failed' }
      - name: Verify V2.2 R8 Operational source closed loop
        run: python 04_Build/v2/verify_r8_operational.py --source
      - name: Build packaged runtime and installer
        run: ./04_Build/build_v2_windows.ps1
      - name: Sign in to Azure Artifact Signing
        if: vars.KZ_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign final installer with Azure Artifact Signing
        if: vars.KZ_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.KZ_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.KZ_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.KZ_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\installer_output_v2\Kazuizhi_AI_Enterprise_V2.2.0_R8_Operational.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: 卡嘴子 AI 自动化运行平台
          description-url: https://github.com/yangq6623-cmd/kazuizhi-ai-growth-center
      - name: Verify final installer signature
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.0_R8_Operational.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ('${{ vars.KZ_ARTIFACT_SIGNING_ENABLED }}' -eq 'true' -and $signature.Status -ne 'Valid') {
            throw "Artifact Signing was enabled but the installer signature is not valid: $($signature.Status)"
          }
          Write-Host "Installer signature status: $($signature.Status)"
      - name: Scan final installer with Microsoft Defender when available
        run: ./04_Build/v2/test_windows_security.ps1
      - name: Test silent install, launch, overwrite upgrade and uninstall
        run: ./04_Build/v2/test_installer.ps1
      - name: Record verified artifact provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.0_R8_Operational.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.2.0_R8_Operational.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = '2.2.0 R8 Operational'
            build = 'KZ-ENTERPRISE-V2.2-R8-OPERATIONAL-20260920'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sha256 = $hash
            checks = @('operational UI identity', 'overwrite migration backup', 'legacy R7 data safety', 'managed local media upload', 'real content growth ID', 'owner video approval gate', 'RTX 3060/NVENC worker packaging', 'CPU video fallback', 'persistent Android H264 live mirror with PNG fallback', 'screen lock human takeover', 'verified publication receipt', 'cross-origin mutation rejection', 'V2.2.1 productization regression contract', 'silent install', 'overwrite reinstall', 'persistent data after uninstall')
            acceptance = 'Automated gates passed; real social account login/captcha and live platform publication remain owner-authorized field acceptance'
          } | ConvertTo-Json -Depth 4 | Set-Content installer_output_v2/BUILD_RECORD.json
          Copy-Item docs/R8_OPERATIONAL_USER_GUIDE.md installer_output_v2/USER_GUIDE.md
          Copy-Item docs/R8_OPERATIONAL_TEST_REPORT.md installer_output_v2/TEST_REPORT.md
      - name: Upload final Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_V2.2.0_R8_Operational
          path: installer_output_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_V2.2.0_R8_Operational_Portable
          path: dist_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Publish final installer to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v2.2.0-r8-operational')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref }}'.StartsWith('refs/tags/')) { '${{ github.ref_name }}' } else { 'v2.2.0-r8-operational' }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag installer_output_v2/* --clobber
          } else {
            gh release create $tag installer_output_v2/* --target '${{ github.sha }}' --title '卡嘴子 AI V2.2.0 R8 Operational' --generate-notes
          }
