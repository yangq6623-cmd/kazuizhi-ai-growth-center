name: Build Kazuizhi AI Enterprise V2.0.0 Beta R1
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/v2-beta-migration']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/v2/**'
      - '04_Build/kazuizhi_v2.0.0.spec'
      - '04_Build/build_v2_windows.ps1'
      - '04_Build/installer/*v2*'
      - '04_Build/installer/*V2*'
      - '.github/workflows/build_v2_enterprise_beta.yml'
  pull_request:
    branches: [main]
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - '.github/workflows/build_v2_enterprise_beta.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Ensure Inno Setup 6
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build and verify V2 R1 source and packaged runtime
        run: ./04_Build/build_v2_windows.ps1
      - name: Test silent install, launch, reinstall and uninstall
        run: ./04_Build/v2/test_installer.ps1
      - name: Record verified R1 artifact provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.0.0_Beta_R1_Setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.0.0_Beta_R1_Setup.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = '2.0.0 Beta R1'
            build = 'KZ-ENTERPRISE-V2-BETA-20260915'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sha256 = $hash
            recovery = @('AI每日复盘中心','今日运营总结','明日计划','历史复盘记录','AI Memory基础模块')
            checks = @('source identity', 'history preservation', 'packaged HTTP runtime', 'port conflict', 'install', 'Windows version metadata', 'reinstall', 'user-data preservation', 'uninstall')
            acceptance = 'Automated checks passed; R1 user visual and feature acceptance pending'
          } | ConvertTo-Json -Depth 4 | Set-Content installer_output_v2/BUILD_RECORD.json
          Copy-Item docs/V2.0.0_BETA_R1_HANDOFF_20260916.md installer_output_v2/TEST_GUIDE.md
      - name: Upload V2.0.0 Beta R1 installer
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_V2.0.0_Beta_R1_Setup
          path: installer_output_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Upload V2.0.0 Beta R1 portable application
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_V2.0.0_Beta_R1_Portable
          path: dist_v2/
          if-no-files-found: error
          retention-days: 90
