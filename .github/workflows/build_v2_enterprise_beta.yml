name: Build Kazuizhi AI Enterprise V2.2.2 R8-23 Final Workbench
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/v2-*', 'codex/r8-23-*', 'codex/r8-25-*', 'codex/r8-26-*', 'codex/r8-27-*', 'codex/r8-28-*', 'codex/827-*', 'codex/833-*', 'codex/840-*', 'codex/853-*', 'codex/854-*', 'codex/857-*', 'codex/859-*', 'codex/phase1-*', 'codex/geo-818-*', 'codex/geo-824-*']
    tags: ['v2.2.2-r8-autonomous*', 'v2.2.2-r8-23-final-workbench*']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - 'docs/R8_OPERATIONAL_*'
      - 'docs/PHASE1_STABILITY_CHANNELS_GEO_ACCEPTANCE.md'
      - 'docs/*827*'
      - 'docs/*830*'
      - 'docs/*831*'
      - 'docs/*833*'
      - 'docs/*854*'
      - 'docs/*857*'
      - 'docs/*859*'
      - '.github/workflows/build_v2_enterprise_beta.yml'
  pull_request:
    # #857 is intentionally reviewed against the exact #856 source branch;
    # do not force a large, unrelated old-main diff merely to exercise CI.
    branches: [main, 'codex/854-seo-geo-closed-loop-fix']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - 'docs/R8_OPERATIONAL_*'
      - 'docs/PHASE1_STABILITY_CHANNELS_GEO_ACCEPTANCE.md'
      - 'docs/*827*'
      - 'docs/*830*'
      - 'docs/*831*'
      - 'docs/*833*'
      - 'docs/*854*'
      - 'docs/*857*'
      - 'docs/*859*'
      - '.github/workflows/build_v2_enterprise_beta.yml'
permissions:
  contents: write
  id-token: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp visible build number and commit
        run: |
          $path = '05_V2.0.0_Source/web/build_info.js'
          $text = Get-Content -LiteralPath $path -Raw
          $shortSha = '${{ github.sha }}'.Substring(0, 8)
          $text = $text.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $text = $text.Replace('__GITHUB_SHA__', $shortSha)
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8
          $manifestPath = '05_V2.0.0_Source/core/release_manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.installed.release = 'R8-24 GEO Growth OS'
          $manifest.installed.github_run = '#${{ github.run_number }}'
          $manifest.installed.commit = $shortSha
          $manifest.installed.package_status = 'packaged_by_github_actions'
          $manifest.candidate.package_status = 'packaged_by_github_actions'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -NoNewline -Encoding UTF8
      - name: Install pinned build and video dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: GEO operating retest independent schedule regression
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node 04_Build/v2/test_geo_817_retest_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Retest UI regression failed' }
          python 04_Build/v2/test_geo_816_operating_retest.py
          if ($LASTEXITCODE -ne 0) { throw 'Operating retest regression failed' }
      - name: "#818 deduplicated GEO history, timeout task classification and three-window safety"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_geo_818_ledger_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO 818 ledger regression failed' }
      - name: "#824 field truth, scope labels and no-early-retest regression"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#824 synthetic/read-only tests: no production task retry or external send'
          python 04_Build/v2/test_geo_824_field_truth.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO #824 field truth regression failed' }
      - name: "#827 additive lineage, lease and uncertain-result protection"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#827 synthetic temporary ledgers only; no external send or production mutation'
          python 04_Build/v2/test_r8_37_compatibility_hardening.py
          if ($LASTEXITCODE -ne 0) { throw '#827 compatibility hardening regression failed' }
      - name: "#833 read-only ledger export safety"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_833_diagnostic_export_contract.py
          if ($LASTEXITCODE -ne 0) { throw '#833 diagnostic exporter safety regression failed' }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '04_Build/v2/Export-Kazuizhi833Diagnostics.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "#833 PowerShell parser failed: $($errors -join '; ')" }
      - name: "#840 owner SEO keyword, new Asset idempotency and safe #839 continuation"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_840_owner_seo_asset.py
          if ($LASTEXITCODE -ne 0) { throw '#840 owner SEO asset regression failed' }
      - name: "#841 service-specific SEO copy, quality gate and guarded 3-page refresh"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_841_seo_content_quality.py
          if ($LASTEXITCODE -ne 0) { throw '#841 SEO quality and safe republish regression failed' }
          python 04_Build/v2/test_841_scheduler_isolation.py
          if ($LASTEXITCODE -ne 0) { throw '#841 SEO quality and safe republish regression failed' }
      - name: "#854 full-ledger progress, in-day continuation, exact GEO routing and QC truth"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#854 isolated temporary ledgers only; no production publish, external AI send or historical replay'
          python 04_Build/v2/test_854_closed_loop_concentration.py
          if ($LASTEXITCODE -ne 0) { throw '#854 concentrated SEO/GEO closed-loop regression failed' }
      - name: "#857 truthful continuation, GEO blocker and SEO revision accounting"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#857 isolated ledgers only; no production publish, external AI send or historical replay'
          python 04_Build/v2/test_857_continuous_closure_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw '#857 continuous closure acceptance failed' }
      - name: "#859 SEO discovery, exact GEO receipt reconciliation and B02/B03 acceptance"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#859 isolated ledgers and HTTP doubles only; no production publish, AI send or historical replay'
          python 04_Build/v2/test_859_closed_loop_repair.py
          if ($LASTEXITCODE -ne 0) { throw '#859 closed-loop repair acceptance failed' }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '04_Build/v2/Export-Kazuizhi859Diagnostics.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "#859 PowerShell parser failed: $($errors -join '; ')" }
      - name: "#836 owner Command reuses existing Mission and creates one safe SEO task"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_836_command_existing_mission.py
          if ($LASTEXITCODE -ne 0) { throw '#836 Command/Mission/SEO task regression failed' }
      - name: Verify #809 GEO browser agent lightweight response
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_geo_809_agent_response_contract.py
          python 04_Build/v2/test_geo_809_queue_routing.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO #809 response regression failed' }
      - name: "#811 GEO read-only HTTP budget and concurrency acceptance"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#811 internal test gate: no external GEO submissions or production data mutations'
          node 04_Build/v2/test_geo_811_fetch_budget.cjs
          if ($LASTEXITCODE -ne 0) { throw 'GEO #811 front-end 100-loop budget regression failed' }
          python 04_Build/v2/test_geo_811_http_concurrency.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO #811 back-end 200-request HTTP concurrency regression failed' }
          python 04_Build/v2/test_r8_29_geo_evidence_lockfree.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO evidence lockfree regression failed' }
      - name: "#812 isolated GEO automatic claim execution and Receipt gate"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#812: synthetic local data only; no external AI question is sent'
          python 04_Build/v2/test_geo_812_claim_execute_receipt.py
          if ($LASTEXITCODE -ne 0) { throw '#812 GEO exactly-once claim / retest / Receipt failed' }
          python 04_Build/v2/test_geo_812_receipt_http_latency.py
          if ($LASTEXITCODE -ne 0) { throw '#812 GEO browser HTTP Receipt ACK latency failed' }
          python 04_Build/v2/test_geo_808_browser_claim_truth.py
          if ($LASTEXITCODE -ne 0) { throw '#808 browser-claim safety regressed' }
          python 04_Build/v2/test_r8_27_geo_browser_agent.py
          if ($LASTEXITCODE -ne 0) { throw '#812 authenticated browser-agent compatibility failed' }
      - name: "#814 GEO root-cause regression - health GET budget and Doubao no-replay"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host '#814 isolated Windows release gate: no external questions or production data changes'
          node 04_Build/v2/test_geo_814_diagnostics_budget.cjs
          if ($LASTEXITCODE -ne 0) { throw 'GEO 814 diagnostics budget regression failed' }
          node 04_Build/v2/test_geo_814_doubao_reconcile.cjs
          if ($LASTEXITCODE -ne 0) { throw 'GEO 814 Doubao safe submit/reconcile failed' }
          node 04_Build/v2/test_geo_extension_808.js
          if ($LASTEXITCODE -ne 0) { throw 'GEO 808 claim/capture safety regression failed' }
      - name: "#815 browser extension canary version compatibility"
        run: |
          Write-Host '#815 safety test: no real external AI questions and no state replay'
          python 04_Build/v2/test_geo_815_canary_version.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO #815 814/808 canary version and no-replay gate failed' }
      - name: "#816 SEO isolated audit retry and UI regression"
        run: |
          Write-Host '#816 SEO-only tests: isolated fake HTTP, no real web publication or GEO state changes'
          python 04_Build/v2/test_seo_816_audit_isolation.py
          if ($LASTEXITCODE -ne 0) { throw '#816 SEO audit isolation contract failed' }
          node 04_Build/v2/test_seo_816_ui_audit.cjs
          if ($LASTEXITCODE -ne 0) { throw '#816 SEO audit UI contract failed' }
      - name: Verify inherited R7 data safety and command engine
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r7_engine.py
          python 04_Build/v2/test_r8_migration_backup_nesting.py
          python 04_Build/v2/test_r7_block_a.py
          python 04_Build/v2/test_r7_block_b.py
      - name: Verify inherited R8 final control plane and autonomous Mission loop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_daily_workforce.py
          python 04_Build/v2/test_decision_center.py
          python 04_Build/v2/test_region_strategy.py
          python 04_Build/v2/test_r8_block_00.py
          python 04_Build/v2/test_r8_complete_growth_ops.py
          python 04_Build/v2/test_r8_identity.py
          python 04_Build/v2/test_r8_completion_upgrade.py
          python 04_Build/v2/test_r8_content_factory_v2_completion.py
          python 04_Build/v2/test_live_business_source.py
          python 04_Build/v2/test_ui_interactions.py
          python 04_Build/v2/test_v221_productization.py
          python 04_Build/v2/test_r8_ui_final.py
          python 04_Build/v2/test_autonomous_ops.py
          python 04_Build/v2/test_ai_gateway.py
      - name: Verify release-gate R8-10 R8-11 R8-12 regressions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_10_async_control_bus.py
          python 04_Build/v2/test_r8_10_video_idempotency.py
          python 04_Build/v2/test_r8_12_unified_account_center.py
          python 04_Build/v2/test_r8_12_account_publish_runtime.py
      - name: Verify release-gate R8-13 R8-14 R8-15 R8-16 SEO autonomy, public deployment and search submission
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_13_multi_account_auth.py
          python 04_Build/v2/test_r8_13_seo_geo_growth.py
          python 04_Build/v2/test_r8_14_seo_geo_autonomy.py
          python 04_Build/v2/test_r8_15_seo_public_deploy.py
          python 04_Build/v2/test_r8_15_server_bootstrap.py
          python 04_Build/v2/test_r8_16_search_submitters.py
          python 04_Build/v2/test_r8_17_direct_file_fallback.py
          python 04_Build/v2/test_r8_31_template_rollback.py
          python 04_Build/v2/test_r8_33_growth_p0_regression.py
          python 04_Build/v2/test_r8_34_geo_seo_closed_loop.py
          python 04_Build/v2/test_r8_35_republish_reconciliation.py
          python 04_Build/v2/test_r8_36_truth_recovery.py
      - name: Verify R8-20 through R8-23 complete workbench release gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_20_seo_geo_growth.py
          python 04_Build/v2/test_r8_21_unified_connectors.py
          python 04_Build/v2/test_r8_22_autonomous_convergence.py
          python 04_Build/v2/test_r8_23_final_growth_os.py
          python 04_Build/v2/test_r8_23_final_workbench_parity.py
          python 04_Build/v2/test_r8_24_control_plane_compaction.py
          python 04_Build/v2/test_geo_774_async_boot_browser.py
          python 04_Build/v2/test_r8_24_geo_evidence_failsafe.py
          python 04_Build/v2/test_r8_24_geo_lockfree_snapshot.py
          python 04_Build/v2/test_business_refresh_nonblocking.py
          python 04_Build/v2/test_phase1_stability_channels_geo.py
          python 04_Build/v2/test_r8_25_website_geo_loop.py
          python 04_Build/v2/test_r8_26_cn_geo_matrix.py
          python 04_Build/v2/test_r8_27_geo_browser_agent.py
          python 04_Build/v2/test_r8_28_geo_browser_extension.py
          node 04_Build/v2/test_geo_extension_808.js
          if ($LASTEXITCODE -ne 0) { throw 'GEO Doubao 808 real-send and Evidence gate failed' }
          node 04_Build/v2/test_geo_alarm_no_reset.js
          if ($LASTEXITCODE -ne 0) { throw 'GEO autonomous alarms repeatedly reset' }
          python 04_Build/v2/test_geo_blockage_truth_805.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO technical/auth blocker truth gate failed' }
          python 04_Build/v2/test_geo_legacy_reconciliation_807.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO 807 historical receipt reconciliation and single canary gate failed' }
          python 04_Build/v2/test_geo_808_browser_claim_truth.py
          if ($LASTEXITCODE -ne 0) { throw 'GEO 808 strict browser claim and nonstarving canary gate failed' }
          python 04_Build/v2/test_r8_24_owner_ui_recovery.py
          python 04_Build/v2/test_r8_25_runtime_truth_and_backpressure.py
          node 04_Build/v2/test_r8_25_fetch_budget.js
          python 04_Build/v2/test_r8_25_owner_cold_start.py
      - name: Check every browser script
        run: |
          Get-ChildItem 05_V2.0.0_Source/web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" } }
          Get-ChildItem 05_V2.0.0_Source/browser_extension/kazuizhi_geo -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Extension JavaScript syntax failed: $($_.Name)" } }
      - name: Verify V2.2 R8 Autonomous source closed loop
        run: python 04_Build/v2/verify_r8_operational.py --source
      - name: Build packaged runtime and installer
        run: ./04_Build/build_v2_windows.ps1
      - name: Sign in to Azure Artifact Signing
        if: vars.KZ_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign final installer with Azure Artifact Signing
        if: vars.KZ_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.KZ_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.KZ_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.KZ_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\installer_output_v2\Kazuizhi_AI_Enterprise_V2.2.2_R8-23_Final_Complete_Workbench.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: 卡嘴子 AI R8-23 完整运营工作台
          description-url: https://github.com/yangq6623-cmd/kazuizhi-ai-growth-center
      - name: Verify final installer signature
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.2_R8-23_Final_Complete_Workbench.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ('${{ vars.KZ_ARTIFACT_SIGNING_ENABLED }}' -eq 'true' -and $signature.Status -ne 'Valid') {
            throw "Artifact Signing was enabled but the installer signature is not valid: $($signature.Status)"
          }
          Write-Host "Installer signature status: $($signature.Status)"
      - name: Scan final installer with Microsoft Defender when available
        run: ./04_Build/v2/test_windows_security.ps1
      - name: Test silent install, launch, overwrite upgrade and uninstall
        run: ./04_Build/v2/test_installer.ps1
      - name: Record verified artifact provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.2_R8-23_Final_Complete_Workbench.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.2.2_R8-23_Final_Complete_Workbench.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = '2.2.2 R8-23 Final Complete Workbench'
            build = 'KZ-ENTERPRISE-V2.2.2-R8-AUTONOMOUS-20260922'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sha256 = $hash
            checks = @('R7/R8 shared Mission identity', 'boss goal persistence', 'normal ChatGPT async Decision Pack control', 'local-first authorized Mission planning', 'optional realtime ChatGPT degradation', 'local autonomous post-render QC', 'R8-12 durable account registry', 'single unified owner account center', 'retired Android/ADB runtime', 'Windows browser QR session routing', 'truthful publication planning', 'receipt-gated publication truth', 'R8-12 partial recovery', 'same-Growth Mission identity lock', 'Windows DPAPI local credential storage path', 'RTX 3060/NVENC worker packaging', 'CPU video fallback', 'verified publication receipt truth gate', 'R8-15 guarded IIS SEO deployment', 'canonical/schema/robots public verification', 'R8-15 one-click server field bootstrap', 'R8-16 IndexNow/Search Console truthful submission receipt gate', 'Google OAuth automatic refresh', 'user scheduled-task runtime supervisor', 'seven-day durable acceptance ledger', 'GEO mention/recommendation/citation split', '24h/72h/7d GEO retest coverage', 'formal 50-question queue gate', '#827 additive Mission/Opportunity/Action/Task/Attempt/Revision/Publication/Receipt/Schedule lineage', '#827 exact-attempt lease heartbeat', '#827 uncertain external result quarantine and no blind replay', '#857 latest continuation Batch identity is preserved', '#857 GEO claim and diagnostics share exact no-replay blockers', '#857 new SEO Assets and existing-Asset revisions are separate', '#857 historical runtime is not a candidate 24-hour claim', 'cross-origin mutation rejection', 'silent install', 'overwrite reinstall', 'persistent data after uninstall') + @('#859 bounded verified-scope SEO Opportunity discovery', '#859 exact Task/Run/Attempt Receipt reconciliation without resend', '#859 B02/B03 evidence-qualified continuation')
            acceptance = 'Automated release gates passed and the candidate can start an independent field ledger. #859 independent 24-hour/7-day uptime is not claimed by CI. Real OAuth/login/captcha, live platform publication, real external-AI Evidence, Google crawl/indexing and business conversion remain field acceptance; PUBLISHED and SUBMITTED still require their own real receipts.'
          } | ConvertTo-Json -Depth 4 | Set-Content installer_output_v2/BUILD_RECORD.json
          Copy-Item docs/R8_OPERATIONAL_USER_GUIDE.md installer_output_v2/USER_GUIDE.md
          Copy-Item docs/R8_OPERATIONAL_TEST_REPORT.md installer_output_v2/TEST_REPORT.md
          Copy-Item docs/PHASE1_STABILITY_CHANNELS_GEO_ACCEPTANCE.md installer_output_v2/PHASE1_ACCEPTANCE.md
          Copy-Item docs/SEO_GEO_824_FIELD_REPAIR_ACCEPTANCE_20261018.md installer_output_v2/SEO_GEO_824_REPAIR_REPORT.md
          Copy-Item docs/SEO_GEO_827_FIELD_ACCEPTANCE_20261019.md installer_output_v2/SEO_GEO_827_FIELD_ACCEPTANCE.md
          Copy-Item docs/R7_R8_ARCHITECTURE_PROTECTION_AND_827_HARDENING_20261019.md installer_output_v2/R7_R8_827_ARCHITECTURE_PROTECTION.md
          Copy-Item docs/SEO_GEO_827_INCREMENTAL_HARDENING_TEST_REPORT_20261019.md installer_output_v2/SEO_GEO_827_TEST_REPORT.md
          Copy-Item docs/SEO_GEO_830_FIELD_REGRESSION_AND_831_FIX_20261019.md installer_output_v2/SEO_GEO_830_831_FIELD_REPORT.md
          Copy-Item docs/SEO_GEO_833_AFTERNOON_RECONCILIATION_AND_FIX_20261019.md installer_output_v2/SEO_GEO_833_AFTERNOON_REPORT.md
          Copy-Item docs/SEO_GEO_853_SPECIAL_REPAIR_AND_ACCEPTANCE_20261020.md installer_output_v2/SEO_GEO_853_REPAIR_REPORT.md
          Copy-Item docs/SEO_GEO_854_CLOSED_LOOP_FIX_AND_ACCEPTANCE_20261021.md installer_output_v2/SEO_GEO_854_CLOSED_LOOP_REPORT.md
          Copy-Item docs/SEO_GEO_857_CONTINUOUS_CLOSURE_FIX_AND_ACCEPTANCE_20261021.md installer_output_v2/SEO_GEO_857_ACCEPTANCE_REPORT.md
          Copy-Item docs/SEO_GEO_859_CLOSED_LOOP_REPAIR_AND_ACCEPTANCE_20261022.md installer_output_v2/SEO_GEO_859_ACCEPTANCE_REPORT.md
          Copy-Item 04_Build/v2/Export-Kazuizhi859Diagnostics.ps1 installer_output_v2/Export-Kazuizhi859Diagnostics.ps1
          Copy-Item 04_Build/v2/Export-Kazuizhi833Diagnostics.ps1 installer_output_v2/Export-Kazuizhi833Diagnostics.ps1
      - name: Package GEO Chrome extension 2.2.2.854
        run: |
          $source = '05_V2.0.0_Source/browser_extension/kazuizhi_geo'
          $bundle = 'installer_output_v2/Kazuizhi_GEO_Chrome_Extension_2.2.2.854.zip'
          Compress-Archive -Path "$source/*" -DestinationPath $bundle -CompressionLevel Optimal -Force
          $sum = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash
          "$sum  Kazuizhi_GEO_Chrome_Extension_2.2.2.854.zip" | Add-Content installer_output_v2/SHA256SUMS.txt
          Copy-Item docs/GEO_808_ALARM_BLOCKAGE_HANDOFF_20261017.md installer_output_v2/GEO_808_HANDOFF.md
