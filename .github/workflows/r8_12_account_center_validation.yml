name: Validate R8-12 Unified Account Center

on:
  push:
    branches: ['r8-12-*']
    paths:
      - '05_V2.0.0_Source/core/account_registry.py'
      - '05_V2.0.0_Source/core/runtime_integrity.py'
      - '05_V2.0.0_Source/integrations/account_router.py'
      - '05_V2.0.0_Source/integrations/publish_dry_run_queue.py'
      - '05_V2.0.0_Source/integrations/credential_vault.py'
      - '05_V2.0.0_Source/integrations/oauth_adapters.py'
      - '05_V2.0.0_Source/promotion/publish_orchestrator.py'
      - '05_V2.0.0_Source/promotion/r8_11_runtime_convergence_patch.py'
      - '05_V2.0.0_Source/backend/r8_12_account_center_patch.py'
      - '05_V2.0.0_Source/backend/r8_11_backbone_patch.py'
      - '05_V2.0.0_Source/web/r8_12_account_center.html'
      - '05_V2.0.0_Source/web/r8_12_account_center_bridge.js'
      - '05_V2.0.0_Source/web/r8_12_startup_coordinator.js'
      - '05_V2.0.0_Source/web/memory.js'
      - '04_Build/v2/test_r8_12_unified_account_center.py'
      - '04_Build/v2/test_r8_12_account_publish_runtime.py'
      - 'docs/R8_12_ACCOUNT_PUBLISH_0_TO_10_STANDARD.md'
      - '.github/workflows/r8_12_account_center_validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '05_V2.0.0_Source/core/account_registry.py'
      - '05_V2.0.0_Source/core/runtime_integrity.py'
      - '05_V2.0.0_Source/integrations/account_router.py'
      - '05_V2.0.0_Source/integrations/publish_dry_run_queue.py'
      - '05_V2.0.0_Source/integrations/credential_vault.py'
      - '05_V2.0.0_Source/integrations/oauth_adapters.py'
      - '05_V2.0.0_Source/promotion/publish_orchestrator.py'
      - '05_V2.0.0_Source/promotion/r8_11_runtime_convergence_patch.py'
      - '05_V2.0.0_Source/backend/r8_12_account_center_patch.py'
      - '05_V2.0.0_Source/backend/r8_11_backbone_patch.py'
      - '05_V2.0.0_Source/web/r8_12_account_center.html'
      - '05_V2.0.0_Source/web/r8_12_account_center_bridge.js'
      - '05_V2.0.0_Source/web/r8_12_startup_coordinator.js'
      - '05_V2.0.0_Source/web/memory.js'
      - '04_Build/v2/test_r8_12_unified_account_center.py'
      - '04_Build/v2/test_r8_12_account_publish_runtime.py'
      - 'docs/R8_12_ACCOUNT_PUBLISH_0_TO_10_STANDARD.md'
      - '.github/workflows/r8_12_account_center_validation.yml'

permissions:
  contents: read

jobs:
  validate-account-center:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r 05_V2.0.0_Source/requirements.txt
      - name: Verify durable account migration, device pool and routing
        run: python 04_Build/v2/test_r8_12_unified_account_center.py
      - name: Verify account route publish dry-run and partial recovery
        run: python 04_Build/v2/test_r8_12_account_publish_runtime.py
      - name: Compile R8-12 runtime modules
        run: |
          python -m py_compile 05_V2.0.0_Source/core/account_registry.py
          python -m py_compile 05_V2.0.0_Source/core/runtime_integrity.py
          python -m py_compile 05_V2.0.0_Source/integrations/account_router.py
          python -m py_compile 05_V2.0.0_Source/integrations/publish_dry_run_queue.py
          python -m py_compile 05_V2.0.0_Source/integrations/credential_vault.py
          python -m py_compile 05_V2.0.0_Source/integrations/oauth_adapters.py
          python -m py_compile 05_V2.0.0_Source/promotion/publish_orchestrator.py
          python -m py_compile 05_V2.0.0_Source/promotion/r8_11_runtime_convergence_patch.py
          python -m py_compile 05_V2.0.0_Source/backend/r8_12_account_center_patch.py
          node --check 05_V2.0.0_Source/web/r8_12_startup_coordinator.js
      - name: Verify durable routing is the publication source of truth
        run: |
          $planner = Get-Content 05_V2.0.0_Source/promotion/publish_orchestrator.py -Raw
          @('route_account','r8_12_durable_account_registry','account_asset_id','route_kind','没有真实平台 Receipt') | ForEach-Object {
            if (-not $planner.Contains($_)) { throw "Missing durable publish-routing contract: $_" }
          }
          if ($planner.Contains('_matching_accounts')) { throw 'Legacy region/service account matcher is still active in R8-12 publication planning.' }
          $dryrun = Get-Content 05_V2.0.0_Source/integrations/publish_dry_run_queue.py -Raw
          @('device_asset_id','adb_device_id','final_publish_allowed','publishes_content') | ForEach-Object {
            if (-not $dryrun.Contains($_)) { throw "Missing durable dry-run contract: $_" }
          }
      - name: Verify owner UI routes platform accounts through coordinated R8-12 startup
        run: |
          $loader = Get-Content 05_V2.0.0_Source/web/memory.js -Raw
          if (-not $loader.Contains('/r8_12_startup_coordinator.js')) { throw 'Owner shell does not load the R8-12.1 startup coordinator.' }
          $startup = Get-Content 05_V2.0.0_Source/web/r8_12_startup_coordinator.js -Raw
          @('/r8_10_workbench.js','/r8_10_truth_convergence.js','/r8_11_backbone_ui.js','/r8_11_execution_tab_hotfix.js','/r8_12_account_center_bridge.js','forceInitialDashboardOnce','dedupeGeneratedSingletons','kz:app-ready') | ForEach-Object {
            if (-not $startup.Contains($_)) { throw "Missing coordinated startup contract: $_" }
          }
          $bridge = Get-Content 05_V2.0.0_Source/web/r8_12_account_center_bridge.js -Raw
          @('data-execution-page="accounts"','/r8_12_account_center.html?embed=1','stopImmediatePropagation') | ForEach-Object {
            if (-not $bridge.Contains($_)) { throw "Missing owner account-route contract: $_" }
          }
      - name: Verify recovery, truth and security contracts
        run: |
          $registry = Get-Content 05_V2.0.0_Source/core/account_registry.py -Raw
          @('ACC-','all_local_services','preferred_device_id','legacy_account_ids','account_assets_last_good','禁止静默换号','没有真实平台回执不得记为已发布') | ForEach-Object {
            if (-not $registry.Contains($_)) { throw "Missing account registry contract: $_" }
          }
          $integrity = Get-Content 05_V2.0.0_Source/core/runtime_integrity.py -Raw
          @('runtime_last_good','same_growth_snapshot_is_less_complete','same_growth_mission_identity_drift','mission_identity_drift_blocked','deduped_same_growth_missions','partial_runtime_recovery','different_active_growth') | ForEach-Object {
            if (-not $integrity.Contains($_)) { throw "Missing runtime recovery contract: $_" }
          }
          $vault = Get-Content 05_V2.0.0_Source/integrations/credential_vault.py -Raw
          @('CryptProtectData','CryptUnprotectData','secrets_in_github','secrets_in_registry') | ForEach-Object {
            if (-not $vault.Contains($_)) { throw "Missing credential vault contract: $_" }
          }
          $oauth = Get-Content 05_V2.0.0_Source/integrations/oauth_adapters.py -Raw
          @('未配置官方授权','publish_scope_requires_platform_approval','不会伪造扫码登录或发布权限') | ForEach-Object {
            if (-not $oauth.Contains($_)) { throw "Missing OAuth truth contract: $_" }
          }
          $ui = Get-Content 05_V2.0.0_Source/web/r8_12_account_center.html -Raw
          @('统一账号资产中心','已连接','需授权','设备离线','平台限制','重新授权') | ForEach-Object {
            if (-not $ui.Contains($_)) { throw "Missing owner UX contract: $_" }
          }
          $standard = Get-Content docs/R8_12_ACCOUNT_PUBLISH_0_TO_10_STANDARD.md -Raw
          @('0→10 成熟度','最低发布门槛：7.5','故障注入测试矩阵','Receipt') | ForEach-Object {
            if (-not $standard.Contains($_)) { throw "Missing 0-to-10 acceptance standard: $_" }
          }
          Write-Host 'R8-12 validates durable account identity, coordinated cold start, Mission identity lock, truthful publication planning and monotonic partial recovery.'
