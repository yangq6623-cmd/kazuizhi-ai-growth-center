name: GEO 769 Stability Preflight Before Installer
on:
  push:
    branches:
      - review/geo-769-stability-preflight-20261009
    paths:
      - '05_V2.0.0_Source/web/r8_12_startup_coordinator.js'
      - '05_V2.0.0_Source/web/geo-growth-os.js'
      - '05_V2.0.0_Source/backend/r8_20_seo_geo_growth_patch.py'
      - '04_Build/v2/test_r8_24_geo_evidence_failsafe.py'
      - '04_Build/v2/test_r8_23_final_workbench_parity.py'
      - '.github/workflows/geo_769_stability_preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-recovery-no-installer:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
      - name: Validate startup, browser and backend syntax
        run: |
          node --check 05_V2.0.0_Source/web/r8_12_startup_coordinator.js
          node --check 05_V2.0.0_Source/web/geo-growth-os.js
          python -m py_compile 05_V2.0.0_Source/backend/r8_20_seo_geo_growth_patch.py
      - name: Failure injection and snapshot integrity tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_24_geo_evidence_failsafe.py
          python 04_Build/v2/test_r8_24_geo_lockfree_snapshot.py
      - name: R8 startup and SEO GEO parity
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_12_unified_account_center.py
          python 04_Build/v2/test_r8_23_final_workbench_parity.py
      - name: Real browser Evidence source test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_geo_evidence_source_browser.py
