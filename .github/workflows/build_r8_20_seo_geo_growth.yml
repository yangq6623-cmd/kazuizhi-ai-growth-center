name: Build Kazuizhi R8-23.2 Runtime Truth Closed Loop Pilot RC1

on:
  push:
    branches: ['r8-23-final-autonomous-growth-os-*']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - '.github/workflows/build_r8_20_seo_geo_growth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp canonical build identity
        run: |
          $shortSha = '${{ github.sha }}'.Substring(0, 8)
          $buildTime = (Get-Date).ToUniversalTime().ToString('o')

          $path = '05_V2.0.0_Source/web/build_info.js'
          $text = Get-Content -LiteralPath $path -Raw
          $text = $text.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $text = $text.Replace('__GITHUB_SHA__', $shortSha)
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8

          $manifestPath = '05_V2.0.0_Source/core/release_manifest.json'
          $manifestText = Get-Content -LiteralPath $manifestPath -Raw
          $manifestText = $manifestText.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $manifestText = $manifestText.Replace('__GITHUB_SHA__', $shortSha)
          $manifestText = $manifestText.Replace('__GITHUB_BUILD_TIME__', $buildTime)
          Set-Content -LiteralPath $manifestPath -Value $manifestText -NoNewline -Encoding UTF8

      - name: Install pinned dependencies and browser test driver
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
          python -m pip install playwright==1.55.0

      - name: Verify R7 R8 GEO Phase 1-3 R8-20 R8-21 R8-22 R8-23 and R8-23.2
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r7_engine.py
          python 04_Build/v2/test_r7_block_a.py
          python 04_Build/v2/test_r7_block_b.py
          python 04_Build/v2/test_r8_identity.py
          python 04_Build/v2/test_r8_10_async_control_bus.py
          python 04_Build/v2/test_r8_11_backbone.py
          python 04_Build/v2/test_r8_12_unified_account_center.py
          python 04_Build/v2/test_r8_13_seo_geo_growth.py
          python 04_Build/v2/test_r8_14_seo_geo_autonomy.py
          python 04_Build/v2/test_r8_15_seo_public_deploy.py
          python 04_Build/v2/test_r8_16_search_submitters.py
          python 04_Build/v2/test_r8_17_remote_agent.py
          python 04_Build/v2/test_ai_gateway.py
          python 04_Build/v2/test_r8_18_model_connection_center.py
          python 04_Build/v2/test_r8_18_model_gateway_routes.py
          python 04_Build/v2/test_r8_18_evidence_ledger.py
          python 04_Build/v2/test_r8_19_geo_phase1.py
          python 04_Build/v2/test_r8_19_geo_phase1_48_acceptance.py
          python 04_Build/v2/test_r8_19_geo_main_platform_integration.py
          python 04_Build/v2/test_r8_19_model_connection_ui.py
          python 04_Build/v2/test_r8_19_geo_live_gate.py
          python 04_Build/v2/test_r8_19_geo_browser_first.py
          python 04_Build/v2/test_r8_19_geo_ui_polish.py
          python 04_Build/v2/test_r8_19_geo_field_fix.py
          python 04_Build/v2/test_r8_19_startup_resilience.py
          python 04_Build/v2/test_r8_19_geo_phase2.py
          python 04_Build/v2/test_r8_19_geo_autonomy.py
          python 04_Build/v2/test_r8_19_geo_phase3.py
          python 04_Build/v2/test_r8_20_seo_geo_growth.py
          python 04_Build/v2/test_r8_20_phase3_publish_bridge.py
          python 04_Build/v2/test_r8_20_24h_runtime.py
          python 04_Build/v2/test_r8_21_unified_connectors.py
          python 04_Build/v2/test_r8_22_autonomous_convergence.py
          python 04_Build/v2/test_r8_23_final_growth_os.py
          python 04_Build/v2/test_r8_23_2_runtime_truth.py

      - name: Verify production entrypoint activates R8-19 through R8-23.2
        run: |
          $run = Get-Content -LiteralPath '05_V2.0.0_Source/run.py' -Raw
          foreach ($marker in @('r8_19_geo_validation_patch','r8_19_geo_phase3_patch','r8_20_seo_geo_growth_patch','runtime_resilience','SetThreadExecutionState','start_content_execution_worker')) {
            if (-not $run.Contains($marker)) { throw "Production entrypoint missing $marker" }
          }
          $patch = Get-Content -LiteralPath '05_V2.0.0_Source/backend/r8_20_seo_geo_growth_patch.py' -Raw
          foreach ($marker in @('seo-geo-growth-intelligence.js','seo-geo-connector-matrix.js','seo_geo_connector_router_v2','/api/r8-20/seo-geo','/api/r8-21/seo-geo/connectors','/api/r8-21/seo-geo/controller-routes','seo_geo_source_tracking_patch','/api/r8-13/seo-geo/run','/api/r8-20/runtime-health')) {
            if (-not $patch.Contains($marker)) { throw "R8-21 runtime integration missing $marker" }
          }
          $truthPatch = Get-Content -LiteralPath '05_V2.0.0_Source/core/r8_20_growth_truth_patch.py' -Raw
          foreach ($marker in @('r8_22_autonomy_convergence_patch','r8_23_growth_os_patch','r8_23_2_runtime_truth_patch')) {
            if (-not $truthPatch.Contains($marker)) { throw "Production activation missing $marker" }
          }
          $r822 = Get-Content -LiteralPath '05_V2.0.0_Source/backend/r8_22_autonomy_convergence_patch.py' -Raw
          foreach ($marker in @('/api/r8-22/autonomy','/api/r8-22/autonomy/events','/api/r8-22/autonomy/receipt','command_execution.reconcile_jobs','autonomous_ops.sync_from_runtime','r7_engine.run_due_jobs')) {
            if (-not $r822.Contains($marker)) { throw "R8-22 runtime integration missing $marker" }
          }
          $r823 = Get-Content -LiteralPath '05_V2.0.0_Source/backend/r8_23_growth_os_patch.py' -Raw
          foreach ($marker in @('/api/r8-23/growth-os','/api/r8-23/growth-os/utilization','r8_23_growth_operating_system','r8_23_growth_os.js','convergence.controller_tick')) {
            if (-not $r823.Contains($marker)) { throw "R8-23 runtime integration missing $marker" }
          }
          $r8232 = Get-Content -LiteralPath '05_V2.0.0_Source/backend/r8_23_2_runtime_truth_patch.py' -Raw
          foreach ($marker in @('/api/health','/api/runtime-health','/api/version','/api/readiness','/api/r8-23-2/runtime-truth','/api/r8-23-2/decision-pack','r8_23_2_runtime_truth.js')) {
            if (-not $r8232.Contains($marker)) { throw "R8-23.2 runtime truth integration missing $marker" }
          }

      - name: Integrate owner runtime truth and model connection center into packaged web
        run: |
          $targets = @(
            '05_V2.0.0_Source/web/index.html',
            '05_V2.0.0_Source/web/operational.html'
          )
          foreach ($path in $targets) {
            $text = Get-Content -LiteralPath $path -Raw
            if (-not $text.Contains('model-connection-center.css')) {
              $text = $text.Replace('</head>', '<link rel="stylesheet" href="model-connection-center.css"></head>')
            }
            if (-not $text.Contains('model-connection-center.js')) {
              $text = $text.Replace('</body>', '<script src="model-connection-center.js"></script></body>')
            }
            if (-not $text.Contains('r8_23_2_runtime_truth.js')) {
              $text = $text.Replace('</body>', '<script src="r8_23_2_runtime_truth.js"></script></body>')
            }
            if (-not $text.Contains('model-connection-center.js') -or -not $text.Contains('model-connection-center.css') -or -not $text.Contains('r8_23_2_runtime_truth.js')) {
              throw "R8-23.2 UI injection failed: $path"
            }
            Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8
          }

      - name: Check every browser script
        run: |
          Get-ChildItem 05_V2.0.0_Source/web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" } }

      - name: Real Chrome source responsiveness gate
        timeout-minutes: 4
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_19_browser_responsiveness.py

      - name: Verify packaged source contract
        run: |
          python 04_Build/v2/verify_v2_autonomous.py --source
          python 04_Build/v2/verify_r8_operational.py --source

      - name: Build packaged runtime and installer
        run: ./04_Build/build_v2_windows.ps1 -SkipSourceVerification

      - name: Optional Authenticode signing
        env:
          KZ_CODESIGN_PFX_B64: ${{ secrets.KZ_CODESIGN_PFX_B64 }}
          KZ_CODESIGN_PFX_PASSWORD: ${{ secrets.KZ_CODESIGN_PFX_PASSWORD }}
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe'
          $statusPath = 'installer_output_v2/AUTHENTICODE_STATUS.json'
          if ([string]::IsNullOrWhiteSpace($env:KZ_CODESIGN_PFX_B64)) {
            @{ signed = $false; status = 'certificate_not_configured'; truth = 'Unsigned build must not claim Authenticode trust.' } | ConvertTo-Json | Set-Content $statusPath
            Write-Host 'Authenticode certificate not configured; keeping truthful unsigned status.'
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'kazuizhi-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:KZ_CODESIGN_PFX_B64))
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:KZ_CODESIGN_PFX_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
            $sig = Set-AuthenticodeSignature -FilePath $setup -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
            if ($sig.Status -ne 'Valid') { throw "Authenticode signing failed: $($sig.Status) $($sig.StatusMessage)" }
            @{ signed = $true; status = 'Valid'; subject = $cert.Subject; thumbprint = $cert.Thumbprint } | ConvertTo-Json | Set-Content $statusPath
            Remove-Item $pfxPath -Force
          }

      - name: Real Chrome packaged-runtime responsiveness gate
        timeout-minutes: 4
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_19_browser_responsiveness.py --exe 'dist_v2/Kazuizhi_AI_Enterprise_V2.0.0_Beta/Kazuizhi_AI_Enterprise_V2.0.0_Beta.exe'

      - name: Scan final installer with Microsoft Defender when available
        run: ./04_Build/v2/test_windows_security.ps1

      - name: Test silent install launch overwrite upgrade and uninstall
        run: ./04_Build/v2/test_installer.ps1

      - name: Record R8-23.2 Pilot RC1 installer provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = '2.2.2 R8-23.2 Pilot RC1 Runtime Truth & Closed-Loop Acceptance'
            commit = '${{ github.sha }}'
            run_number = '${{ github.run_number }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sha256 = $hash
            engineering_scope = 19
            controller = 'ChatGPT sole strategic controller -> bounded Decision Pack -> deterministic local scheduler/workers'
            model_policy = @('local model preferred for high-frequency low-risk batch work','RTX 3060 preferred local compute when eligible','Doubao required for selected high-value SEO/GEO stages and important content QC','ordinary local/Doubao output never formal GEO evidence')
            truth_policy = 'Configured != invoked != generated != QC passed != published != submitted != crawled != indexed != ranked. Promotion requires real Receipt/Evidence.'
            outcome_scope = 'site visit -> mini-program visit -> consultation -> task -> order; no money/amount/revenue/profit/ROI'
            social_policy = 'one real social platform Post ID/URL/Receipt closed loop before copying to another platform'
            field_acceptance = @('24h real field run PENDING','72h real fault/recovery run PENDING','7-day real production run PENDING')
            ci_note = 'CI regression/synthetic soak is engineering evidence only and does not claim physical-time field acceptance.'
          } | ConvertTo-Json -Depth 6 | Set-Content installer_output_v2/BUILD_RECORD_R8_23_2_PILOT_RC1.json

      - name: Upload R8-23.2 Pilot RC1 Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_R8_23_2_Pilot_RC1
          path: installer_output_v2/
          if-no-files-found: error
          retention-days: 90

      - name: Upload R8-23.2 Pilot RC1 portable application
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_R8_23_2_Pilot_RC1_Portable
          path: dist_v2/
          if-no-files-found: error
          retention-days: 90
