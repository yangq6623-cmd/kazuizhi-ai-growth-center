name: Build Kazuizhi R8-17 Desktop Remote Agent
on:
  push:
    branches: ['r8-17-remote-agent-*']
    paths:
      - '05_V2.0.0_Source/**'
      - '04_Build/**'
      - '.github/workflows/build_r8_17_remote_agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp visible build number and commit
        run: |
          $path = '05_V2.0.0_Source/web/build_info.js'
          $text = Get-Content -LiteralPath $path -Raw
          $shortSha = '${{ github.sha }}'.Substring(0, 8)
          $text = $text.Replace('__GITHUB_RUN_NUMBER__', '${{ github.run_number }}')
          $text = $text.Replace('__GITHUB_SHA__', $shortSha)
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding UTF8
      - name: Install pinned dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r 05_V2.0.0_Source/requirements.txt -r 04_Build/v2/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Verify inherited R7 and R8 control plane
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r7_engine.py
          python 04_Build/v2/test_r7_block_a.py
          python 04_Build/v2/test_r7_block_b.py
          python 04_Build/v2/test_daily_workforce.py
          python 04_Build/v2/test_decision_center.py
          python 04_Build/v2/test_region_strategy.py
          python 04_Build/v2/test_r8_block_00.py
          python 04_Build/v2/test_r8_device_center.py
          python 04_Build/v2/test_r8_social_center.py
          python 04_Build/v2/test_r8_complete_growth_ops.py
          python 04_Build/v2/test_r8_identity.py
          python 04_Build/v2/test_r8_completion_upgrade.py
          python 04_Build/v2/test_r8_content_factory_v2_completion.py
          python 04_Build/v2/test_live_business_source.py
          python 04_Build/v2/test_ui_interactions.py
          python 04_Build/v2/test_v221_productization.py
          python 04_Build/v2/test_r8_ui_final.py
          python 04_Build/v2/test_autonomous_ops.py
          python 04_Build/v2/test_ai_gateway.py
          python 04_Build/v2/test_r8_realtime_mirror.py
      - name: Verify R8-10 through R8-12 regressions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_10_async_control_bus.py
          python 04_Build/v2/test_r8_10_video_idempotency.py
          python 04_Build/v2/test_r8_11_backbone.py
          python 04_Build/v2/test_r8_11_social_session_probe.py
          python 04_Build/v2/test_r8_11_publish_dry_run_queue.py
          python 04_Build/v2/test_r8_11_runtime_convergence_patch.py
          python 04_Build/v2/test_r8_12_unified_account_center.py
          python 04_Build/v2/test_r8_12_account_publish_runtime.py
          python 04_Build/v2/test_r8_12_local_first_closed_loop.py
      - name: Verify R8-13 through R8-17 SEO remote closed loop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python 04_Build/v2/test_r8_13_multi_account_auth.py
          python 04_Build/v2/test_r8_13_seo_geo_growth.py
          python 04_Build/v2/test_r8_14_seo_geo_autonomy.py
          python 04_Build/v2/test_r8_15_seo_public_deploy.py
          python 04_Build/v2/test_r8_15_server_bootstrap.py
          python 04_Build/v2/test_r8_16_search_submitters.py
          python 04_Build/v2/test_r8_17_remote_agent.py
      - name: Check every browser script
        run: |
          Get-ChildItem 05_V2.0.0_Source/web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" } }
      - name: Verify R8 source closed loop
        run: python 04_Build/v2/verify_r8_operational.py --source
      - name: Build packaged runtime and installer
        run: ./04_Build/build_v2_windows.ps1
      - name: Scan final installer with Microsoft Defender when available
        run: ./04_Build/v2/test_windows_security.ps1
      - name: Test silent install, launch, overwrite upgrade and uninstall
        run: ./04_Build/v2/test_installer.ps1
      - name: Record R8-17 artifact provenance
        run: |
          $setup = 'installer_output_v2/Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "$hash  Kazuizhi_AI_Enterprise_V2.2.2_R8_Autonomous_Mission_Core.exe" | Set-Content installer_output_v2/SHA256SUMS.txt
          @{
            version = '2.2.2 R8-17 Desktop Remote Agent'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sha256 = $hash
            remote_agent_protocol = 'kz-remote-agent-v1 / token-v1'
            remote_agent_endpoint = 'https://kazuizhi.com/kz-remote-v1/agent.ashx/v1'
            checks = @('full inherited R7/R8 regression gates', 'R8-17 pairing validation', 'Windows DPAPI secret path', 'Remote Agent upload protocol', 'remote SEO deploy patch', 'IndexNow remote key hosting', 'source closed loop', 'Microsoft Defender scan when available', 'silent install', 'overwrite reinstall', 'persistent data after uninstall')
            acceptance = 'Desktop build passed automated gates. Production PUBLISHED still requires real public HTTP/content/canonical/Schema/robots verification; SUBMITTED still requires a real search-platform acceptance receipt.'
          } | ConvertTo-Json -Depth 4 | Set-Content installer_output_v2/BUILD_RECORD_R8_17.json
      - name: Upload R8-17 Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_R8_17_Desktop_Remote_Agent
          path: installer_output_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Upload R8-17 portable application
        uses: actions/upload-artifact@v4
        with:
          name: Kazuizhi_AI_Enterprise_R8_17_Desktop_Remote_Agent_Portable
          path: dist_v2/
          if-no-files-found: error
          retention-days: 90
