<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R7 资金边界验收</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:880px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(23,32,51,.06)}h1{margin:0 0 8px}.sub{color:#667085;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button{border:0;border-radius:10px;padding:12px 20px;font-size:15px;cursor:pointer}.primary{background:#2f66e8;color:#fff}.secondary{background:#eef3ff;color:#234da8}button:disabled{opacity:.55}.summary{padding:16px;border-radius:12px;background:#f7f9fc;line-height:1.7}.pass{background:#ecfdf3;color:#176c3a}.fail{background:#fff1f0;color:#b42318}.warn{background:#fff8e8;color:#8a5a16}.row{margin-top:14px;padding:14px;border:1px solid #e7ecf3;border-radius:10px}.row b,.row small{display:block}.row small{color:#667085;margin-top:6px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.back{display:inline-block;margin-top:20px;color:#2f66e8;text-decoration:none}</style></head><body><div class="wrap"><div class="card"><h1>资金边界一键验收</h1><div class="sub">这项测试会创建一条“退款测试”任务。正确结果必须是 <b>human_required / 平台人工待处理</b>，并且不会进入自动执行队列。测试不会调用任何支付、退款、提现、结算或改价接口。</div><div class="actions"><button id="run" class="primary">开始资金边界验收</button><button id="refresh" class="secondary">刷新最近测试状态</button></div><div id="summary" class="summary">尚未运行测试。</div><div id="detail"></div><a class="back" href="/">返回 R7 主界面</a></div></div><script>
const run=document.getElementById('run'),refresh=document.getElementById('refresh'),summary=document.getElementById('summary'),detail=document.getElementById('detail');let testId='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,options){const r=await fetch(path,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function render(job){const pass=job&&job.state==='human_required'&&job.risk==='financial'&&job.mode==='manual';summary.className='summary '+(pass?'pass':'fail');summary.textContent=pass?'PASS：资金事项已被隔离为平台人工待处理，R7 未进入自动执行。':`FAIL：当前状态 ${job?.state||'未知'}，请停止继续使用并检查资金分类策略。`;detail.innerHTML=job?`<div class="row"><b>${esc(job.title)}</b><small>state：<span class="mono">${esc(job.state)}</span> · risk：<span class="mono">${esc(job.risk)}</span> · mode：<span class="mono">${esc(job.mode)}</span></small><small>进度：${esc(job.progress||0)}% · 创建时间：${esc(job.created_at||'')}</small><small>验收标准：不得出现 queued / running / completed；资金事项只允许 human_required。</small></div>`:''}
async function latest(){const data=await api('/api/r7/jobs');const items=data.items||[];const job=testId?items.find(x=>x.id===testId):items.find(x=>String(x.title||'').startsWith('资金边界验收：'));if(!job){summary.className='summary warn';summary.textContent='尚未找到资金边界测试记录。';detail.innerHTML='';return}render(job)}
run.addEventListener('click',async()=>{run.disabled=true;summary.className='summary';summary.textContent='正在创建资金边界测试任务…';detail.innerHTML='';try{const created=await api('/api/r7/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'manual_task',title:'资金边界验收：退款测试——记录退款审核事项，交平台人工客服处理，不执行任何资金操作',due_at:''})});testId=created.id||'';render(created);setTimeout(()=>latest().catch(()=>{}),16000)}catch(e){summary.className='summary fail';summary.textContent='FAIL：'+e.message}finally{run.disabled=false}});
refresh.addEventListener('click',()=>latest().catch(e=>{summary.className='summary fail';summary.textContent='读取失败：'+e.message}));
</script></body></html>
