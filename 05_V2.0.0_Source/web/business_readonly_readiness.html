<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R7 经营数据只读接入准备</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(23,32,51,.06)}h1{margin:0 0 8px}.sub{color:#667085;line-height:1.7}.summary{margin-top:20px;padding:16px;border-radius:12px;background:#f7f9fc;line-height:1.7}.pass{background:#ecfdf3;color:#176c3a}.warn{background:#fff8e8;color:#8a5a16}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.item{padding:15px;border:1px solid #e7ecf3;border-radius:12px}.item b,.item small{display:block}.item small{color:#667085;margin-top:6px}.template{margin-top:18px;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px;white-space:pre-wrap;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer}.primary{background:#2f66e8;color:#fff}.secondary{background:#eef3ff;color:#234da8}.back{display:inline-block;margin-top:20px;color:#2f66e8;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>真实经营数据只读接入准备</h1><div class="sub">这里仅检查“有没有真实、可追溯的聚合经营数据”。不会读取手机号、地址、身份证、密钥、退款明细或支付明细，也不会修改生产业务数据。</div><div class="actions"><button id="check" class="primary">检查当前接入状态</button><button id="copy" class="secondary">复制只读快照模板</button></div><div id="summary" class="summary">尚未检查。</div><div id="grid" class="grid"></div><pre id="template" class="template"></pre><a class="back" href="/">返回 R7 主界面</a></div></div><script>
const summary=document.getElementById('summary'),grid=document.getElementById('grid'),template=document.getElementById('template');
const sample={source:'server-readonly-export',as_of:'YYYY-MM-DD HH:mm:ss',window:'today',mini_program_visits:null,repair_requests:null,new_orders:null,completed_orders:null,cancelled_orders:null,new_users:null,new_technicians:null,approved_technicians:null,active_technicians:null,new_leaders:null,active_leaders:null,leader_referrals:null,leader_orders:null,published_content:null,real_interactions:null,leads:null,technician_inquiries:null,review_count:null,by_region:null,by_skill:null,channel_visits:null,channel_orders:null,by_region_skill:null};template.textContent=JSON.stringify(sample,null,2);
async function api(path){const r=await fetch(path);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function check(){try{const d=await api('/api/business-analytics');const ok=d.status==='verified';summary.className='summary '+(ok?'pass':'warn');summary.textContent=ok?'已接入：当前 R7 正在使用带来源和统计时间的真实聚合经营快照。':'未接入：R7 目前不会展示订单、用户或成交的占位数字，也不会用公开搜索信号冒充经营数据。';const modules=d.modules||{};const verified=Object.values(modules).filter(x=>x&&x.status==='verified').length;const total=Object.keys(modules).length;grid.innerHTML=`<div class="item"><b>数据来源</b><small>${esc(d.source||'尚未提供')}</small></div><div class="item"><b>统计截止时间</b><small>${esc(d.as_of||'尚未提供')}</small></div><div class="item"><b>统计窗口</b><small>${esc(d.window||'尚未提供')}</small></div><div class="item"><b>分析模块完整度</b><small>${verified}/${total||5} 个模块已具备可验证数据</small></div><div class="item"><b>安全规则</b><small>${esc(d.truth_rule||'只接受聚合数据，不接受敏感个人信息或资金明细')}</small></div><div class="item"><b>下一步</b><small>${ok?'核对指标口径与服务器实际统计是否一致。':'从生产服务器生成“只读聚合快照”，至少包含 source 与 as_of，再导入 R7 经营分析。'}</small></div>`}catch(e){summary.className='summary warn';summary.textContent='检查失败：'+e.message}}
document.getElementById('check').addEventListener('click',check);document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(sample,null,2));summary.className='summary pass';summary.textContent='只读经营快照模板已复制。'}catch{summary.className='summary warn';summary.textContent='浏览器未允许复制，请直接从下方模板手动复制。'}});check();
</script></body></html>
