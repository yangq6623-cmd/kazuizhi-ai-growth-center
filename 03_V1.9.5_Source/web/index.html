<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>卡嘴智 AI 运营驾驶舱 V1.9.5 Enterprise</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<h2>卡嘴智 AI</h2>
<div>运营驾驶舱</div><div>增长分析中心</div><div>SEO/GEO中心</div><div>AI任务中心</div><div>自动化中心</div><div>系统监控</div>
</aside>
<main class="main">
<header class="header"><h1>卡嘴智 AI 运营驾驶舱</h1><p>V1.9.5 Enterprise Full Dashboard</p></header>
<section class="kpi-grid">
<div class="card"><h3>今日订单</h3><strong id="orders">0</strong></div>
<div class="card"><h3>今日收入</h3><strong id="income">¥0</strong></div>
<div class="card"><h3>用户增长</h3><strong id="users">0</strong></div>
<div class="card"><h3>师傅数量</h3><strong id="tech">0</strong></div>
<div class="card"><h3>团长数量</h3><strong id="leaders">0</strong></div>
<div class="card"><h3>AI执行任务</h3><strong id="ai">0</strong></div>
</section>
<section class="panel"><h2>增长分析中心</h2><div class="grid"><div class="card">用户增长趋势</div><div class="card">订单增长趋势</div><div class="card">收入趋势分析</div></div></section>
<section class="panel"><h2>SEO/GEO增长中心</h2><div class="grid"><div class="card">关键词监控</div><div class="card">内容优化</div><div class="card">搜索曝光分析</div></div></section>
<section class="panel"><h2>AI自动化中心</h2><div class="grid"><div class="card">任务执行</div><div class="card">自动调度</div><div class="card">异常提醒</div></div></section>
<section class="panel"><h2>系统监控</h2><div id="status">Enterprise Dashboard Online</div></section>
<div id="chart" style="height:320px"></div>
</main></div>
<script>
let chart=echarts.init(document.getElementById('chart'));chart.setOption({title:{text:'运营增长趋势'},xAxis:{type:'category',data:['1','2','3','4','5','6']},yAxis:{type:'value'},series:[{type:'line',data:[10,25,40,65,90,120]}]});
</script>
</body></html>
